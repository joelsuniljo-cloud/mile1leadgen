# Render Blueprint: New > Blueprint > connect this repo.
services:
  - type: web
    name: mile1-lead-radar
    runtime: python
    plan: starter            # background polling needs an always-on instance (free tier sleeps)
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: mile1-leads-db
          property: connectionString
      - key: APP_PASSWORD        # login password (user: mile1). REQUIRED: the app is public otherwise
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SERPER_API_KEY      # enables LinkedIn + Web sources
        sync: false
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: POLL_MINUTES
        value: "15"
      - key: SEED_DEMO
        value: "false"

databases:
  - name: mile1-leads-db
    plan: basic-256mb
    databaseName: leads
